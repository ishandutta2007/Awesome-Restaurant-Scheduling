<svg width="800" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF512F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DD2476;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CA1AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C4E0E5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" rx="15"/>
  
  <!-- Dynamic floating elements -->
  <circle cx="150" cy="50" r="30" fill="white" opacity="0.1">
    <animate attributeName="cy" values="50; 70; 50" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="650" cy="200" r="40" fill="white" opacity="0.15">
    <animate attributeName="cx" values="650; 620; 650" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="100" cy="200" r="20" fill="white" opacity="0.1">
    <animate attributeName="r" values="20; 30; 20" dur="3s" repeatCount="indefinite" />
  </circle>

  <text x="50%" y="45%" font-family="Arial, sans-serif" font-size="42" fill="white" font-weight="bold" text-anchor="middle" dominant-baseline="middle">
    Awesome Restaurant Scheduling
  </text>
  <text x="50%" y="65%" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" dominant-baseline="middle" opacity="0.9">
    Curated SaaS Platforms &amp; Open-Source Projects for Hospitality
  </text>
</svg>
